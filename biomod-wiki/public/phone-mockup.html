<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phone Mockup Preview</title>
  <style>
    html,body{height:100%;margin:0;background:#222;display:flex;align-items:center;justify-content:center}
    .device{
      width: 420px;
      height: 892px;
      border-radius: 48px;
      background: #111;
      padding: 28px 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.03);
      position: relative;
      display:flex;align-items:center;justify-content:center;
    }
    /* notch */
    .device:before{
      content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
      width:210px;height:30px;background:#111;border-radius:18px 18px 12px 12px;box-shadow:0 1px 0 rgba(255,255,255,0.02) inset;
    }
    /* camera dots to mimic sensors */
    .device:after{
      content:'';position:absolute;top:16px;left:calc(50% + 72px);width:8px;height:8px;background:#2c2c2c;border-radius:50%;box-shadow:8px 0 0 #2c2c2c,-8px 0 0 #2c2c2c;
    }
    .screen{
      width:100%;height:100%;background:#fff;border-radius:36px;overflow:hidden;display:block;border:8px solid #0b0b0b;box-sizing:border-box;
      position:relative;
    }
    .homebar{
      position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:120px;height:6px;background:rgba(255,255,255,0.18);border-radius:999px;z-index:60
    }
    iframe{width:100%;height:100%;border:0;display:block}
    .label{position:fixed;bottom:20px;color:#fff;opacity:0.7;font-family:system-ui;font-size:13px}
  </style>
</head>
<body>
  <div class="device" role="img" aria-label="Phone mockup">
    <div class="screen">
      <iframe src="/" title="Site preview in phone mockup" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      <div class="homebar" aria-hidden="true"></div>
    </div>
  </div>
  <div class="label">Phone mockup — local preview</div>
</body>
</html>
