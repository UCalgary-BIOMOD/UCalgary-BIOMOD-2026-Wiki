<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iPhone 15 Mockup Preview</title>
  <style>
    html,body{height:100%;margin:0;background:#111;display:flex;align-items:center;justify-content:center}
    .device{
      width: 430px; /* visual frame width */
      height: 932px; /* visual frame height */
      border-radius: 60px;
      background: linear-gradient(180deg,#0b0b0b,#0f0f0f);
      padding: 28px 18px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.03);
      position: relative;
      display:flex;align-items:center;justify-content:center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    /* Dynamic pill (Dynamic Island) */
    .island{
      position:absolute;top:6px;left:50%;transform:translateX(-50%);
      width:220px;height:36px;background:#0b0b0b;border-radius:22px;box-shadow:0 1px 0 rgba(255,255,255,0.02) inset;z-index:40
    }
    .island:after{content:'';position:absolute;right:14px;top:9px;width:8px;height:8px;background:#222;border-radius:50%}
    .screen{
      width:100%;height:100%;background:#fff;border-radius:38px;overflow:hidden;display:block;border:10px solid #050507;box-sizing:border-box;position:relative
    }
    .homebar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:134px;height:6px;background:rgba(255,255,255,0.14);border-radius:999px;z-index:60}
    iframe{width:100%;height:100%;border:0;display:block}
    .badge{position:fixed;bottom:18px;color:#fff;opacity:0.85;font-size:13px}
  </style>
</head>
<body>
  <div class="device" role="img" aria-label="iPhone 15 mockup">
    <div class="island" aria-hidden="true"></div>
    <div class="screen">
      <iframe src="/" title="Site preview in iPhone 15 mockup" sandbox="allow-same-origin allow-scripts allow-forms"></iframe>
      <div class="homebar" aria-hidden="true"></div>
    </div>
  </div>
  <div class="badge">iPhone 15 preview (local)</div>
</body>
</html>
